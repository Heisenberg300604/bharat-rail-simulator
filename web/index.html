        <p>Drive Indian Railways trains in your browser. This game needs JavaScript and WebGL; please enable JavaScript to play.</p>
        <h2>What you can drive</h2>
        <ul>
          <li>WAP-7, WAG-9, WAP-4 and WCAM-1 electric locomotives with LHB, ICF and freight rakes</li>
